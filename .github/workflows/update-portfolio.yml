name: Atualizar Portfólio

on:
  schedule:
    # De hora em hora. Um repositório novo aparece na página na hora seguinte.
    - cron: '7 * * * *'
  workflow_dispatch: # Permite executar manualmente

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do portfólio
        uses: actions/checkout@v4

      - name: Gerar projects-data.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gerar-dados.py

      - name: Commit e push quando houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # git add antes de comparar: o arquivo pode não estar versionado ainda,
          # e nesse caso "git diff" sozinho não enxerga nada.
          git add projects-data.json
          if git diff --cached --quiet; then
            echo "Nada a commitar." >> $GITHUB_STEP_SUMMARY
          else
            git commit -m "chore: atualiza dados dos projetos [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
            echo "Dados dos projetos atualizados." >> $GITHUB_STEP_SUMMARY
          fi
